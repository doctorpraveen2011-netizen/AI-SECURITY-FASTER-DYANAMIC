version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-security-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://secops:secops_secret_2026@postgres:5432/ai_security_db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - WAZUH_API_URL=${WAZUH_API_URL:-https://wazuh.manager:55000}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/sandbox_data:/app/sandbox_data
      - ./backend/knowledge_base:/app/knowledge_base

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-security-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-security-postgres
    environment:
      - POSTGRES_USER=secops
      - POSTGRES_PASSWORD=secops_secret_2026
      - POSTGRES_DB=ai_security_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-security-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
